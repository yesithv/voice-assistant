<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AI Voice Assistant powered by Faster-Whisper, Llama (Groq or Ollama) and Piper TTS" />
    <meta name="author" content="YesithV" />
    <title>AI Voice Assistant</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <main>
      <div class="assistant">
        <header class="chat-header">
          <div class="header-logo" aria-hidden="true"><i class="fa fa-microphone"></i></div>
          <div class="header-text">
            <h1>AI Voice Assistant</h1>
            <p>Faster-Whisper &middot; Llama &middot; Piper TTS</p>
          </div>
          <button id="theme-toggle" type="button" class="icon-button" aria-label="Toggle dark mode" title="Toggle dark mode">
            <i class="fa fa-moon-o"></i>
          </button>
        </header>

        <section id="chat-window" aria-live="polite">
          <div id="empty-state">
            <div class="empty-icon" aria-hidden="true"><i class="fa fa-commenting-o"></i></div>
            <h2>How can I help you today?</h2>
            <p>Type a message or tap the microphone to talk. I'll answer out loud.</p>
            <div class="suggestions">
              <button type="button" class="suggestion">What can you do?</button>
              <button type="button" class="suggestion">Translate "good morning" into French</button>
              <button type="button" class="suggestion">Recommend a sci-fi book</button>
              <button type="button" class="suggestion">Explain machine learning simply</button>
            </div>
          </div>
          <div id="message-list"></div>
        </section>

        <div id="recording-bar" class="recording-bar hidden" role="status">
          <span class="rec-dot" aria-hidden="true"></span>
          Recording <span id="recording-timer">0:00</span> &mdash; tap stop when you're done
        </div>

        <form id="chat-form" class="chat-form" autocomplete="off">
          <input
            type="text"
            id="message-input"
            placeholder="Type your message or use the microphone..."
            maxlength="500"
            aria-label="Message"
          />
          <button
            id="send-button"
            type="button"
            class="action-button"
            aria-label="Record a voice message"
            title="Record a voice message"
          >
            <i class="fa fa-microphone"></i>
          </button>
        </form>

        <footer class="chat-footer">
          Created by <a href="https://yesithv.github.io/" target="_blank" rel="noopener noreferrer">YesithV</a>
          &middot;
          <a href="https://github.com/yesithv/voice-assistant" target="_blank" rel="noopener noreferrer"><i class="fa fa-github"></i> Source</a>
        </footer>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
